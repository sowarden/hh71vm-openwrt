name: Validate public release

on:
  push:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        with:
          persist-credentials: false
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install loader dependency
        run: python -m pip install -r tools/requirements.txt

      - name: Check workflow syntax
        run: sh autobuild/check-workflows.sh "$RUNNER_TEMP/actionlint"

      - name: Rebuild helper executables from source
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi cmake squashfs-tools
          sh autobuild/install-usign.sh "$RUNNER_TEMP/usign"
          echo "$RUNNER_TEMP/usign/build" >> "$GITHUB_PATH"
          sh openwrt-feed/package/utils/modem-extra-tools/build-helper.sh

      - name: Run publication and loader tests
        run: python -m unittest discover -s tests -v

      - name: Check Python syntax
        run: >-
          python -m py_compile
          tools/ram_boot.py
          tools/release/build-package-bundle.py
          tools/release/build-package-index.py
          tools/release/package_metadata.py
          tools/release/extras_common.py
          tools/release/build-extras.py
          tools/release/publish-extras.py
          autobuild/build.py
          autobuild/common.py
          autobuild/inspect_image.py
          autobuild/publish.py
          openwrt-feed/target/linux/rtkmipsel/image/mkrtkimg.py

      - name: Verify published checksums
        working-directory: firmware
        run: sha256sum -c SHA256SUMS

      - name: Check installer syntax
        run: |
          sh -n extras/modem-extra-tools/install.sh
          sh -n autobuild/package/hh71vm-feed/files/reconcile.sh
          sh -n autobuild/install-usign.sh

      - name: Run modem backend unit tests
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1
          cd openwrt-feed/package/utils/modem-extra-tools
          lua5.1 tests/unit.lua files

      - name: Build optional bundle
        run: python tools/release/build-package-bundle.py extras/modem-extra-tools
