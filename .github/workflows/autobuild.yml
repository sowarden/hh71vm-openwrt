name: Build and publish immutable firmware

on:
  push:
    branches: [main, openwrt-autobuild]

permissions:
  contents: read

# No shared latest tag or concurrency group: every push retains its own identity.

jobs:
  validate:
    if: github.repository == 'sowarden/hh71vm-openwrt' && vars.HH71VM_AUTOBUILD_ENABLED == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: |
          sudo apt-get update
          sudo apt-get install -y cmake lua5.1 gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi python3-serial squashfs-tools
          sh autobuild/install-usign.sh "$RUNNER_TEMP/usign"
          echo "$RUNNER_TEMP/usign/build" >> "$GITHUB_PATH"
      - name: Check workflow syntax
        run: sh autobuild/check-workflows.sh "$RUNNER_TEMP/actionlint"
      - name: Validate public key and run tests
        env:
          HH71VM_FEED_PUBLIC_KEY: ${{ vars.HH71VM_FEED_PUBLIC_KEY }}
        run: |
          PYTHONPATH=autobuild python3 -c 'import os; from common import public_key; public_key(os.environ["HH71VM_FEED_PUBLIC_KEY"].encode())'
          sh openwrt-feed/package/utils/modem-extra-tools/build-helper.sh
          python3 -m unittest discover -s tests -v
          lua5.1 openwrt-feed/package/utils/modem-extra-tools/tests/unit.lua openwrt-feed/package/utils/modem-extra-tools/files

  build:
    needs: validate
    runs-on: [self-hosted, linux, ARM64, hh71vm-build]
    timeout-minutes: 1440
    outputs:
      tag: ${{ steps.identity.outputs.tag }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Mask self-hosted runner identity and paths
        run: |
          printf '::add-mask::%s\n' "$HOME" "$RUNNER_NAME" "$RUNNER_TEMP" "$GITHUB_WORKSPACE"
          printf '::add-mask::%s\n' "$(dirname "$RUNNER_TEMP")/hh71vm-cache"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Reserve build identity and directories
        id: identity
        run: |
          python3 - <<'PY'
          import os, sys
          from pathlib import Path
          sys.path.insert(0, 'autobuild')
          from common import identity
          tag = identity(os.environ['GITHUB_SHA'], os.environ['GITHUB_RUN_ID'], os.environ['GITHUB_RUN_ATTEMPT'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('tag=' + tag, file=output)
          (Path(os.environ['RUNNER_TEMP']) / tag / 'candidate').mkdir(parents=True, exist_ok=False)
          PY
          cache_root="$(dirname "$RUNNER_TEMP")/hh71vm-cache"
          mkdir -p "$cache_root/downloads" "$cache_root/ccache"
          printf 'cache-root=%s\n' "$cache_root" >> "$GITHUB_OUTPUT"
      - name: Restore downloads and compiler cache only
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ${{ steps.identity.outputs.cache-root }}/downloads
            ${{ steps.identity.outputs.cache-root }}/ccache
          key: hh71vm-${{ runner.arch }}-${{ hashFiles('autobuild/lock.json', 'autobuild/Dockerfile') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            hh71vm-${{ runner.arch }}-${{ hashFiles('autobuild/lock.json', 'autobuild/Dockerfile') }}-
      - name: Build in a disposable container
        env:
          HH71VM_FEED_PUBLIC_KEY: ${{ vars.HH71VM_FEED_PUBLIC_KEY }}
          BUILD_JOBS: ${{ vars.HH71VM_BUILD_JOBS || '2' }}
          BUILD_TAG: ${{ steps.identity.outputs.tag }}
        run: |
          set -eu
          docker build --pull --build-arg "BUILD_UID=$(id -u)" --build-arg "BUILD_GID=$(id -g)" \
            -f autobuild/Dockerfile -t "hh71vm-build:$BUILD_TAG" autobuild
          docker run --rm --init --cap-drop=ALL --security-opt=no-new-privileges \
            --user "$(id -u):$(id -g)" \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/src,readonly" \
            --mount "type=bind,source=$RUNNER_TEMP/$BUILD_TAG/candidate,target=/output" \
            --mount "type=bind,source=${{ steps.identity.outputs.cache-root }}/downloads,target=/cache/downloads" \
            --mount "type=bind,source=${{ steps.identity.outputs.cache-root }}/ccache,target=/cache/ccache" \
            --env HH71VM_FEED_PUBLIC_KEY \
            "hh71vm-build:$BUILD_TAG" \
            --commit "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --jobs "$BUILD_JOBS"
      - name: Save downloads and compiler cache
        if: always() && steps.identity.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ${{ steps.identity.outputs.cache-root }}/downloads
            ${{ steps.identity.outputs.cache-root }}/ccache
          key: hh71vm-${{ runner.arch }}-${{ hashFiles('autobuild/lock.json', 'autobuild/Dockerfile') }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Transfer the exact unsigned candidate
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.identity.outputs.tag }}
          path: ${{ runner.temp }}/${{ steps.identity.outputs.tag }}/candidate/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Remove this run's container image
        if: always() && steps.identity.outputs.tag != ''
        env:
          BUILD_TAG: ${{ steps.identity.outputs.tag }}
        run: docker image rm "hh71vm-build:$BUILD_TAG" || true

  sign-and-release:
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: candidate
          merge-multiple: true
      - name: Install isolated signing tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake squashfs-tools
          sh autobuild/install-usign.sh "$RUNNER_TEMP/usign"
          echo "$RUNNER_TEMP/usign/build" >> "$GITHUB_PATH"
      - name: Inspect images and sign the exact candidate
        env:
          HH71VM_FEED_SIGNING_KEY: ${{ secrets.HH71VM_FEED_SIGNING_KEY }}
          HH71VM_FEED_PUBLIC_KEY: ${{ vars.HH71VM_FEED_PUBLIC_KEY }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        run: python3 autobuild/publish.py sign candidate --tag "$RELEASE_TAG" --commit "$GITHUB_SHA"
      - name: Retain the signed test candidate
        if: github.ref == 'refs/heads/openwrt-autobuild'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ needs.build.outputs.tag }}-signed-test
          path: candidate/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Publish and verify immutable release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          CANDIDATE_ARTIFACT_ID: ${{ needs.build.outputs.artifact-id }}
        run: python3 autobuild/publish.py publish candidate --tag "$RELEASE_TAG" --commit "$GITHUB_SHA" --artifact-id "$CANDIDATE_ARTIFACT_ID"
