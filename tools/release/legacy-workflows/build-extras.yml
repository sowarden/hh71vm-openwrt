name: Build extras

on:
  push:
    branches: [main]
    paths:
      - 'openwrt-feed/**'
      - 'extras/**'
      - 'firmware/**'
      - 'tools/release/**'
      - 'tests/**'
      - '.github/workflows/*extras.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    outputs:
      candidate_sha256: ${{ steps.build.outputs.candidate_sha256 }}
      auto_publish: ${{ steps.build.outputs.auto_publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gettext \
            git libncurses-dev libssl-dev libelf-dev python2 python3 python3-pip \
            rsync unzip zlib1g-dev file wget time subversion swig \
            gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi lua5.1
          python3 -m pip install -r tools/requirements.txt
      - name: Run host tests
        run: |
          sh openwrt-feed/package/utils/modem-extra-tools/build-helper.sh
          python3 -m unittest discover -s tests -v
          cd openwrt-feed/package/utils/modem-extra-tools
          lua5.1 tests/unit.lua files
      - name: Build fresh packages and candidate bundles
        id: build
        run: |
          set -o pipefail
          python3 tools/release/build-extras.py "$RUNNER_TEMP/openwrt-extras" \
            --output "$RUNNER_TEMP/extras-candidate" --jobs "$(nproc)" \
            2>&1 | tee "$RUNNER_TEMP/extras-build.log"
      - name: Upload candidate bundles (not hardware-tested)
        uses: actions/upload-artifact@v4
        with:
          name: extra-tools-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/extras-candidate/
          if-no-files-found: error
          retention-days: 90
      - name: Preserve build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extras-build-log-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/extras-build.log
            ${{ runner.temp }}/openwrt-extras/.config
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30

  publish-unverified:
    needs: build
    if: needs.build.outputs.auto_publish == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    concurrency:
      group: extra-tools-release
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: extra-tools-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/extras-candidate
      - name: Publish with an explicit hardware-test warning
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA256: ${{ needs.build.outputs.candidate_sha256 }}
        run: |
          python3 tools/release/publish-extras.py publish \
            --directory "$RUNNER_TEMP/extras-candidate" \
            --candidate-sha256 "$CANDIDATE_SHA256" --mode unverified
